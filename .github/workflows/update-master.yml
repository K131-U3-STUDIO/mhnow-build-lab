name: Update MHN master data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4

      - name: Build master JSON
        run: python tools/build_master.py --output data/mhn_master.json

      - name: Commit updated master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mhn_master.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update MHN master data"
            git push
          fi
